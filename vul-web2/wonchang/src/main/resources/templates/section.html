<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:with="pageTitle=${heading + ' | ' + site.name}">
<head th:replace="~{fragments/head :: head}"></head>
<body data-site="wonchang" th:attr="data-path=${activePath}">
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main id="main-content">
  <section class="page-hero"><div class="container"><nav class="breadcrumb" aria-label="현재 위치"><a href="/">홈</a><span aria-hidden="true">/</span><span th:text="${heading}">대학안내</span></nav><span class="eyebrow" th:text="${site.enName}">WONCHANG UNIVERSITY</span><h1 th:text="${heading}">대학안내</h1><p th:text="${intro}">대학 소개</p></div></section>
  <section class="content-section"><div class="container">
    <div th:if="${bodyHtml != null and !#strings.isEmpty(bodyHtml)}" class="section-prose" th:id="${activePath == '/about' ? 'vision' : null}" th:utext="${bodyHtml}"></div>
    <div th:if="${cards != null and !#lists.isEmpty(cards)}" class="section-cards" th:id="${activePath == '/colleges' ? 'departments' : null}">
      <a th:each="card, stat : ${cards}" class="section-card" th:href="${card.href}" th:id="${activePath == '/about' and stat.index == 2 ? 'campus' : (activePath == '/research' and stat.index == 1 ? 'industry' : null)}"><span class="card-number" th:text="${#numbers.formatInteger(stat.count, 2)}">01</span><span class="card-content"><h2 th:text="${card.title}">제목</h2><p th:text="${card.description}">설명</p></span><span class="card-arrow" aria-hidden="true">↗</span></a>
    </div>
  </div></section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script defer src="/js/site.js"></script>
</body>
</html>
