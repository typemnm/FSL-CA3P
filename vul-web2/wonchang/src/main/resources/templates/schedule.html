<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:with="pageTitle=${'학사일정 | ' + site.name}">
<head th:replace="~{fragments/head :: head}"></head>
<body data-site="wonchang" th:attr="data-path=${activePath}">
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main id="main-content">
  <section class="page-hero"><div class="container"><nav class="breadcrumb" aria-label="현재 위치"><a href="/">홈</a><span aria-hidden="true">/</span><span>학사일정</span></nav><span class="eyebrow">ACADEMIC CALENDAR</span><h1>학사일정</h1><p>배움의 흐름을 준비하는 주요 일정을 안내합니다.</p></div></section>
  <section class="content-section"><div class="container narrow-content"><div class="content-heading"><div><span class="eyebrow">SCHEDULE</span><h2>다가오는 일정</h2></div><p>일정은 학사 운영에 따라 변경될 수 있습니다.</p></div><div class="schedule-list"><article th:each="event : ${events}" class="schedule-item"><div class="schedule-date"><span th:text="${event.date}">2026-10-20</span></div><div class="schedule-detail"><h3 th:text="${event.title}">일정</h3><p th:text="${event.location}">장소</p></div><span class="schedule-symbol" aria-hidden="true">↗</span></article><p th:if="${#lists.isEmpty(events)}" class="empty-state">등록된 학사일정이 없습니다.</p></div></div></section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script defer src="/js/site.js"></script>
</body>
</html>
