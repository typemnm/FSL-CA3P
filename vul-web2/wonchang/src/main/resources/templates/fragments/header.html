<!doctype html>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="header">
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <div class="utility-bar">
    <div class="container utility-inner">
      <span class="utility-label" th:text="${site.enName}">WONCHANG UNIVERSITY</span>
      <div class="utility-links">
        <a href="/schedule">학사일정</a>
        <a href="/faq">자주 묻는 질문</a>
        <th:block th:if="${user != null}">
          <a href="/mypage" th:text="|${user.display_name}님|">마이페이지</a>
          <a th:if="${user.role == 'admin'}" href="/admin">관리자</a>
          <a href="/logout">로그아웃</a>
        </th:block>
        <a th:unless="${user != null}" href="/login">로그인</a>
      </div>
    </div>
  </div>
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" th:aria-label="|${site.name} 홈으로|">
        <span class="brand-mark" aria-hidden="true"><span th:text="${site.logoMark}">原</span></span>
        <span class="brand-words"><strong th:text="${site.name}">원창대학교</strong><small th:text="${site.enName}">WONCHANG UNIVERSITY</small></span>
      </a>
      <nav class="desktop-nav" aria-label="주 메뉴">
        <div class="nav-item" th:each="item : ${nav}">
          <a class="nav-link" th:classappend="${activePath == item.href} ? ' is-active'" th:href="${item.href}" th:text="${item.label}">대학안내</a>
          <div class="nav-dropdown" th:if="${item.children != null and !#lists.isEmpty(item.children)}">
            <strong th:text="${item.label}">대학안내</strong>
            <ul><li th:each="child : ${item.children}"><a th:href="${child.href}"><span th:text="${child.label}">대학 소개</span><span aria-hidden="true">↗</span></a></li></ul>
          </div>
        </div>
      </nav>
      <div class="header-actions">
        <button class="icon-button search-toggle" type="button" aria-label="통합검색 열기" aria-expanded="false" aria-controls="global-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.9" cy="10.9" r="6.6"/><path d="m16 16 5 5"/></svg>
        </button>
        <button class="icon-button menu-toggle" type="button" aria-label="전체 메뉴 열기" aria-expanded="false" aria-controls="mobile-nav">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
    <div class="global-search" id="global-search" hidden>
      <div class="container search-panel">
        <div><span class="eyebrow">SEARCH</span><h2>무엇을 찾고 계신가요?</h2><p>대학의 소식과 안내를 한 번에 검색하세요.</p></div>
        <div class="search-panel-form">
          <form id="global-search-form" action="/notices" method="get" role="search">
            <label class="sr-only" for="global-search-input">통합검색어</label>
            <input id="global-search-input" type="search" name="q" placeholder="검색어를 입력하세요" autocomplete="off" required>
            <button type="submit">검색 <span aria-hidden="true">→</span></button>
          </form>
          <div id="search-results" class="search-results" role="status" aria-live="polite"></div>
        </div>
      </div>
    </div>
    <nav class="mobile-nav" id="mobile-nav" aria-label="모바일 메뉴" hidden>
      <details th:each="item : ${nav}">
        <summary><span th:text="${item.label}">대학안내</span><span aria-hidden="true">+</span></summary>
        <div class="mobile-subnav">
          <a th:href="${item.href}" th:text="|${item.label} 안내|">대학안내 안내</a>
          <a th:each="child : ${item.children}" th:href="${child.href}" th:text="${child.label}">대학 소개</a>
        </div>
      </details>
      <div class="mobile-bottom"><a href="/schedule">학사일정</a><a href="/faq">자주 묻는 질문</a><a th:if="${user != null}" href="/mypage">마이페이지</a><a th:unless="${user != null}" href="/login">로그인</a></div>
    </nav>
  </header>
  <div class="flash" role="status" th:if="${flash != null and !#strings.isEmpty(flash)}"><div class="container" th:text="${flash}">처리되었습니다.</div></div>
</th:block>
