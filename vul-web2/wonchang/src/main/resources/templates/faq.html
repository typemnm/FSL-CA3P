<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:with="pageTitle=${'자주 묻는 질문 | ' + site.name}">
<head th:replace="~{fragments/head :: head}"></head>
<body data-site="wonchang" th:attr="data-path=${activePath}">
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main id="main-content">
  <section class="page-hero"><div class="container"><nav class="breadcrumb" aria-label="현재 위치"><a href="/">홈</a><span aria-hidden="true">/</span><span>자주 묻는 질문</span></nav><span class="eyebrow">HELP CENTER</span><h1>자주 묻는 질문</h1><p>궁금한 내용을 빠르게 확인해 보세요.</p></div></section>
  <section class="content-section"><div class="container narrow-content"><div class="content-heading"><div><span class="eyebrow">QUESTIONS &amp; ANSWERS</span><h2>많이 찾는 질문</h2></div><p>질문을 선택하면 답변이 열립니다.</p></div><div class="faq-list"><details th:each="faq : ${faqs}" class="faq-item"><summary><span class="faq-q">Q</span><strong th:text="${faq.question}">질문</strong><span class="faq-plus" aria-hidden="true">+</span></summary><div class="faq-answer"><span class="faq-a">A</span><p th:text="${faq.answer}">답변</p></div></details><p th:if="${#lists.isEmpty(faqs)}" class="empty-state">등록된 질문이 없습니다.</p></div><div class="help-panel"><div><span class="eyebrow">NEED MORE HELP?</span><h3>원하는 답변을 찾지 못하셨나요?</h3><p>공지사항에서 최신 안내를 확인하거나 학교에 문의해 주세요.</p></div><a class="button button-dark" href="/notices">공지사항 보기 <span aria-hidden="true">↗</span></a></div></div></section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script defer src="/js/site.js"></script>
</body>
</html>
