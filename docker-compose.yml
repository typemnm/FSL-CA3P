services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:4173:4173"
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      DASHBOARD_HOST: 0.0.0.0
      PORT: "4173"
      CASPER_DB_PYTHON: /opt/ca3p-venv/bin/python
    volumes:
      - casper-db-data:/app/casper-db/data
      - pentest-reports:/app/reports/pentest-db-runs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/state').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  casper-db-data:
  pentest-reports:
