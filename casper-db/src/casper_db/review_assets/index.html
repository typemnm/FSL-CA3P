<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-@@NONCE@@'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CERT 보고서 · 로컬 검토</title>
  <style>@@STYLE@@</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">C</span><div><strong>CERT 보고서 검토</strong><span class="eyebrow">HWPX → FSL-CA3P JSON 초안</span></div></div>
    <div class="top-actions"><span class="local-badge">로컬 · DB 저장 전</span><button id="download" class="button">전체 JSON 내려받기</button></div>
  </header>
  <div class="workspace">
    <aside>
      <p class="eyebrow">SOURCE REPORT</p><h1 id="filename"></h1>
      <p class="side-description">원문과 추출 후보를 대조하고, 누락과 미확정 사유를 확인합니다.</p>
      <label class="search-label" for="search">취약점 찾기</label><input id="search" type="search" placeholder="URL 또는 취약점 종류 검색">
      <nav id="findings" aria-label="취약점 목록"></nav>
      <details class="source-meta"><summary>원본 식별 정보</summary><dl id="source-meta"></dl></details>
      <p class="side-note">표·문단 위치는 추출 식별자입니다. 원본 문서의 페이지 번호를 뜻하지 않습니다.</p>
    </aside>
    <main>
      <div class="summary-grid" id="stats"></div>
      <section class="finding-heading"><div><p class="eyebrow" id="finding-source"></p><h2 id="finding-title"></h2><p class="url" id="finding-url"></p></div><div id="finding-badges"></div></section>
      <div class="tabs" role="tablist" aria-label="검토 보기">
        <button role="tab" id="tab-fields" data-tab="fields">필드 대조</button>
        <button role="tab" id="tab-payloads" data-tab="payloads">Payload 비교</button>
        <button role="tab" id="tab-raw" data-tab="raw">원문·캡처</button>
        <button role="tab" id="tab-json" data-tab="json">JSON</button>
        <button role="tab" id="tab-review" data-tab="review">검토 기록</button>
      </div>
      <section id="panel" class="panel" role="tabpanel"></section>
      <footer>검토용 추출 초안입니다. 재현 절차와 payload를 실행하지 않습니다. 원본 HWPX의 서식은 별도 원문에서 확인하세요.</footer>
    </main>
  </div>
  <noscript>탭과 원문 비교를 보려면 JavaScript가 필요합니다. 생성된 JSON 파일에서도 모든 추출 내용을 확인할 수 있습니다.</noscript>
  <script type="application/json" id="review-data">@@DATA@@</script>
  <script nonce="@@NONCE@@">@@SCRIPT@@</script>
</body>
</html>
