[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ca3p-report"
version = "0.1.0"
description = "CA3P report agent: collects run results and renders HWPX reports"
requires-python = ">=3.11"
# HWPX writing (build stage). python-hwpx is Alpha; pin to the verified minor.
dependencies = ["python-hwpx>=6.8,<7"]

[project.optional-dependencies]
# collect-history reads casper-db only through its public read-only API.
history = ["casper-case-db"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
ca3p-report = "ca3p_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
