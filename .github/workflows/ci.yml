name: CA3P integration

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ca3p-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: xss-parser/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install deterministic browser dependencies and Python test extras
        run: |
          npm ci --prefix xss-parser
          python -m pip install -r casper-db/requirements-ci.lock
          python -m pip install --no-deps -e ./casper-db
          cd xss-parser
          npx playwright install --with-deps chromium
      - name: Verify all modules, real browser integration and zero skips
        id: verify
        run: node scripts/ci.mjs
        env:
          CASPER_DB_PYTHON: python
          CA3P_REQUIRE_BROWSER: '1'
      - name: Preserve a failed report when setup or verification stops early
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import uuid
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('reports/ci/latest.json')
          now = datetime.now(timezone.utc).isoformat()
          created = False
          try:
              report = json.loads(path.read_text())
              if not isinstance(report, dict):
                  raise ValueError('CI report is not an object')
          except (OSError, ValueError):
              created = True
              report = {
                  'schemaVersion': '1.0', 'id': str(uuid.uuid4()),
                  'source': 'github-actions', 'commitSha': os.getenv('GITHUB_SHA'),
                  'branch': os.getenv('GITHUB_REF_NAME'),
                  'eventName': os.getenv('GITHUB_EVENT_NAME'),
                  'testRef': os.getenv('GITHUB_REF'),
                  'headBranch': os.getenv('GITHUB_HEAD_REF') or None,
                  'baseBranch': os.getenv('GITHUB_BASE_REF') or None,
                  'worktreeDirty': False, 'nodeVersion': None,
                  'startedAt': now, 'completedAt': now,
                  'status': 'failed', 'completeSuite': False,
                  'runUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  'tests': 0, 'passed': 0, 'failed': 0, 'skipped': 0,
                  'jobs': [],
              }
          incomplete = created or report.get('status') == 'running' or (
              report.get('status') == 'passed' and os.getenv('VERIFY_OUTCOME') != 'success'
          )
          if incomplete:
              report.setdefault('jobs', []).append({
                  'id': 'ci-workflow', 'status': 'failed', 'exitCode': 1,
                  'error': 'Setup or verification stopped before a complete result was recorded.',
              })
              report['status'] = 'failed'
              report['completeSuite'] = False
              report['completedAt'] = now
          report['failedJobs'] = sum(job.get('status') == 'failed' for job in report.get('jobs', []))
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Upload structured report and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-${{ github.sha }}
          path: reports/ci/
          if-no-files-found: error
          retention-days: 14

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the API/worker image and check health
        env:
          CA3P_COMMIT_SHA: ${{ github.sha }}
        run: |
          docker compose -p ca3p-ci up --build -d --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:4173/api/health
          docker compose -p ca3p-ci exec -T dashboard node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
      - name: Container diagnostics
        if: failure()
        run: docker compose -p ca3p-ci logs --no-color
      - name: Remove isolated CI containers
        if: always()
        run: docker compose -p ca3p-ci down -v

  integration-gate:
    name: integration-gate
    if: always()
    needs: [tests, container-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every integration job to succeed
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$CONTAINER_RESULT" = success

  publish-ci-summary:
    # A public, counts-only feed lets the device read post-merge results without
    # giving its Internet-facing server a GitHub token or a write endpoint.
    needs: [tests, container-smoke, integration-gate]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Download full-suite artifact when available
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-report-${{ github.sha }}
          path: reports/ci
      - name: Publish sanitized develop test counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CA3P_TEST_RESULT: ${{ needs.tests.result }}
          CA3P_CONTAINER_RESULT: ${{ needs.container-smoke.result }}
          CA3P_GATE_RESULT: ${{ needs.integration-gate.result }}
          CA3P_BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/publish-ci-summary.mjs

  publish-image:
    needs: [integration-gate]
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-report-${{ github.sha }}
          path: reports/ci
      - name: Publish tested source using SHA tag and record immutable digest
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker build --build-arg "VCS_REF=$COMMIT_SHA" --tag "$image:$COMMIT_SHA" .
          docker push "$image:$COMMIT_SHA"
          docker pull "$image:$COMMIT_SHA"
          digest="$(docker image inspect "$image:$COMMIT_SHA" --format '{{index .RepoDigests 0}}')"
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: docker logout ghcr.io

  deploy-staging:
    needs: [publish-image]
    if: github.ref == 'refs/heads/develop' && vars.CA3P_AUTO_DEPLOY == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: read
    with:
      image: ${{ needs.publish-image.outputs.image }}
      environment: staging
    secrets: inherit
